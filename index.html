<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060b18" id="meta-theme-color" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('teraplay-theme') || 'dark';
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.classList.toggle('light', t === 'light');
        var meta = document.getElementById('meta-theme-color');
        if (meta) {
          meta.setAttribute('content', t === 'light' ? '#1253a8' : '#060b18');
        }
      } catch (e) {}
    })();
  </script>
  <title>TeraBox Online Video Player & Fast MP4 Downloader | Free No App</title>
  <!-- data-rh marks these as managed by react-helmet-async, so the per-route
       title and description replace them instead of sitting alongside them. -->
  <meta name="description" data-rh="true"
    content="Stream and download TeraBox, 1024tera, and NephoBox video links online in HD without installing the TeraBox app. Direct fast MP4 download and mobile player." />
  <meta name="keywords" data-rh="true"
    content="terabox player, terabox online player, 1024terabox player, terabox video downloader, watch terabox online, nephobox player, terabox to mp4" />
  <meta name="author" content="TeraPlay Universal" />
  <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />

  <!-- Preconnect to CDNs -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Preload hero background images for zero-latency instant flip -->
  <link rel="preload" as="image" href="/assets/bg-day.png" type="image/png" fetchpriority="high" />
  <link rel="preload" as="image" href="/assets/bg-night.png" type="image/png" fetchpriority="high" />

  <meta property="og:title" data-rh="true" content="TeraBox Online Video Player & Fast MP4 Downloader" />
  <meta property="og:description" data-rh="true"
    content="Play TeraBox, 1024tera, and NephoBox video links online in HD without installing the app. Fast MP4 download and instant streaming." />
  <meta property="og:type" content="website" />
  <meta property="og:url" data-rh="true" content="https://teraplay.app/" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TeraBox Online Video Player & Downloader" />
  <meta name="twitter:description" content="Stream TeraBox video links in browser. No app install required." />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "TeraBox Online Video Player & Downloader",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "All",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
</head>

<body class="bg-[#060b18] text-slate-100 antialiased selection:bg-primary selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
